<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HR Promotion Prediction</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; background: #f5f5f5; }
  h2 { text-align: center; }
  form { background: white; padding: 24px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
  label { display: block; margin-top: 12px; font-weight: bold; font-size: 14px; }
  select, input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
  button { margin-top: 20px; width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
  button:hover { background: #1e4fc4; }
  #result { margin-top: 20px; padding: 16px; border-radius: 8px; display: none; }
  #result.success { background: #dcfce7; color: #166534; display: block; }
  #result.fail { background: #fee2e2; color: #991b1b; display: block; }
  #result.error { background: #fef3c7; color: #92400e; display: block; }
</style>
</head>
<body>

<h2>Employee Promotion Prediction</h2>

<form id="predictForm">
  <label>Employee ID</label>
  <input type="number" name="employee_id" required value="1">

  <label>Department</label>
  <select name="department" required>
    <option>Sales & Marketing</option>
    <option>Operations</option>
    <option>Technology</option>
    <option>Analytics</option>
    <option>R&D</option>
    <option>Procurement</option>
    <option>Finance</option>
    <option>HR</option>
    <option>Legal</option>
  </select>

  <label>Region</label>
  <select name="region" id="regionSelect" required></select>

  <label>Education</label>
  <select name="education">
    <option value="">(Not specified)</option>
    <option>Bachelor's</option>
    <option>Master's & above</option>
    <option>Below Secondary</option>
  </select>

  <label>Gender</label>
  <select name="gender" required>
    <option>Male</option>
    <option>Female</option>
  </select>

  <label>Recruitment Channel</label>
  <select name="recruitment_channel" required>
    <option>sourcing</option>
    <option>other</option>
    <option>referred</option>
  </select>

  <label>Number of Trainings</label>
  <input type="number" name="no_of_trainings" min="1" value="1" required>

  <label>Age</label>
  <input type="number" name="age" min="18" value="25" required>

  <label>Previous Year Rating (1-5, leave blank if none)</label>
  <input type="number" name="previous_year_rating" min="1" max="5" step="0.1">

  <label>Length of Service (years)</label>
  <input type="number" name="length_of_service" min="1" max="40" value="1" required>

  <label>Awards Won?</label>
  <select name="awards_won" required>
    <option value="0">No</option>
    <option value="1">Yes</option>
  </select>

  <label>Average Training Score (0-100)</label>
  <input type="number" name="avg_training_score" min="0" max="100" value="60" required>

  <button type="submit">Predict</button>
</form>

<div id="result"></div>

<script>
  // Populate region dropdown: region_1 -> region_34
  const regionSelect = document.getElementById('regionSelect');
  for (let i = 1; i <= 34; i++) {
    const opt = document.createElement('option');
    opt.value = `region_${i}`;
    opt.textContent = `region_${i}`;
    regionSelect.appendChild(opt);
  }

  document.getElementById('predictForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const formData = new FormData(form);
    const data = {};
    for (const [key, value] of formData.entries()) {
      data[key] = value;
    }

    // Type conversion
    data.employee_id = parseInt(data.employee_id);
    data.no_of_trainings = parseInt(data.no_of_trainings);
    data.age = parseInt(data.age);
    data.length_of_service = parseInt(data.length_of_service);
    data.avg_training_score = parseInt(data.avg_training_score);
    data["awards_won?"] = parseInt(data.awards_won);
    delete data.awards_won;

    if (data.previous_year_rating === "") {
      data.previous_year_rating = null;
    } else {
      data.previous_year_rating = parseFloat(data.previous_year_rating);
    }
    if (data.education === "") {
      data.education = null;
    }

    const resultDiv = document.getElementById('result');
    resultDiv.className = '';
    resultDiv.textContent = 'Predicting...';
    resultDiv.style.display = 'block';

    try {
      const res = await fetch('/predict', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      const json = await res.json();

      if (!res.ok) {
        resultDiv.className = 'error';
        resultDiv.textContent = 'Error: ' + JSON.stringify(json.detail);
        return;
      }

      const pred = json.prediction;
      resultDiv.className = pred.is_promoted ? 'success' : 'fail';
      resultDiv.innerHTML = `
        <b>Promotion probability:</b> ${(pred.probability * 100).toFixed(2)}%<br>
        <b>Decision threshold:</b> ${(pred.strict_threshold * 100).toFixed(0)}%<br>
        <b>Result:</b> ${pred.is_promoted ? 'Recommend for Promotion ' : 'Keep under observation '}<br>
      `;
    } catch (err) {
      resultDiv.className = 'error';
      resultDiv.textContent = 'Connection error: ' + err.message;
    }
  });
</script>

</body>
</html>
